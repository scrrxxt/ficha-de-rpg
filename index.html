<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha de personagem</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topo">
        <section class="conteiner-topo">
            <div class="conteiner-nome-personagem">
                <p>Nome personagem</p>
                <input type="text" name="" id="">
            </div>
            <div class="conteiner-nome-jogador">
                <p>Nome jogador</p>
                <input type="text" name="" id="">
            </div>
            <div class="conteiner-ponto-xp">
                <p>Pontos de experiência</p>
                <input type="text" name="" id="">
            </div>
            <div class="conteiner-raca">
                <p>Raça</p>
                <input type="text" name="" id="">
            </div>
            <div class="conteiner-class">
                <p>Classe</p>
                <input type="text" name="" id="">
            </div>
            <div class="conteiner-alinhamento">
                <p>Alinhamento</p>
                <input type="text" name="" id="">
            </div>
        </section>
    </header>
    <main class="conteiner-conteudo-principal">
        <section class="sessao-conteudo-principal">
            <div class="conteiner-modificadores">

            <div class="força">
                <p>FOR</p>
                <input type="text" name="" id="">
            </div>
            <div class="destreza">
                <p>DES</p>
                <input type="text" name="" id="">
            </div>
            <div class="constituicao">
                <p>CON</p>
                <input type="text" name="" id="">
            </div>
            <div class="inteligencia">
                <p>INT</p>
                <input type="text" name="" id="">
            </div>
            <div class="sabedoria">
                <p>SAB</p>
                <input type="text" name="" id="">
            </div>
            <div class="carisma">
                <p>CAR</p>
                <input type="text" name="" id="">
            </div>
        </div>

            <div class="conteiner-vdv-img">
              <div class="conteiner-vdv">
                <div>
                    <p>Vida</p>
                    <input type="text" name="" id="">
                </div>
                <div>
                    <p>Defesa</p>
                    <input type="text" name="" id="">
                </div>
                <div>
                    <p>Velocidade</p>
                    <input type="text" name="" id="">
                </div>
            </div>
            <div class="conteiner-img">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQqwghEoTeT0xaa_2ElhxOiSXuKUZZNKaJ6x5zWmh8tXg&s=10">
            </div>
        </div>
            <div class="conteiner-biografia">
                <h2>
                    Biografia
                </h2>
                <textarea name="" id="" cols="30" rows="25"></textarea>
            </div>
        </section>
        <section class="sessao-conteudo-secundario">
            <div class="conteiner-equipamento">
                <h2>Equipamentos</h2>
                <textarea name="" id="" cols="30" rows="10"></textarea>
            </div>
            <div class="conteiner-caracteristicas">
                <h2>Características</h2>
                <textarea name="" id="" cols="30" rows="10"></textarea>
            </div>
        </section>
    </main>
    <footer>
        <div class="conteiner-rodape">
            <a href="">Ctrl + Play</a>
        </div>
    </footer>
</body>
</html>
